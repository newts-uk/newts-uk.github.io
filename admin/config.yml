local_backend: true

backend:
  name: github
  repo: newts-uk/newts-uk.github.io
  branch: main
  base_url: https://newts-uk-login.owen-da5.workers.dev

logo_url: /images/logo-no-bg.png

media_folder: images
public_folder: images

collections:
  - name: services
    label: Services
    label_singular: Service
    folder: data/services
    extension: json
    format: json
    create: true
    identifier_field: title
    summary: "{{title}}"
    sortable_fields: [title, order]
    fields:
      - { name: title, label: Service Name, widget: string }
      - name: category
        label: Category
        widget: relation
        collection: categories
        search_fields: [title]
        value_field: id
        display_fields: [title]
      - { name: summary, label: Summary, widget: text, hint: "One or two sentences shown on the service card. Include the price, e.g. £60 per hour." }
      - name: details
        label: What's included
        widget: markdown
        required: false
        buttons: [bold, italic, link, bulleted-list]
        editor_components: []
        hint: "Use the bullet-list button in the toolbar — one bullet per point."
      - { name: order, label: Position, widget: number, value_type: int, required: false, hint: "Lower numbers appear first. Leave gaps of 10 so new services can slot in between." }

  - name: categories
    label: Categories
    label_singular: Category
    folder: data/categories
    extension: json
    format: json
    create: true
    identifier_field: title
    summary: "{{title}}"
    fields:
      - { name: id, label: ID, widget: string, hint: "Lowercase with hyphens, e.g. early-years. Never change this once services use it." }
      - { name: title, label: Title, widget: string }
      - { name: summary, label: Summary, widget: text }
      - { name: order, label: Position, widget: number, value_type: int, required: false, hint: "Lower numbers appear first." }

  - name: team
    label: Team
    label_singular: Team Member
    folder: data/team
    extension: json
    format: json
    create: true
    identifier_field: fullName
    summary: "{{fullName}}"
    fields:
      - { name: name, label: First Name, widget: string }
      - { name: fullName, label: Full Name, widget: string }
      - { name: title, label: Job Title, widget: string }
      - { name: image, label: Photo, widget: image }
      - { name: bio, label: Bio, widget: markdown, buttons: [bold, italic, link, bulleted-list], editor_components: [], hint: "Write naturally — use the toolbar for bold, links and lists." }
      - { name: order, label: Position, widget: number, value_type: int, required: false, hint: "Lower numbers appear first." }

  - name: policies
    label: Policies & Information
    label_singular: Policy
    folder: data/policies
    extension: json
    format: json
    create: true
    identifier_field: title
    summary: "{{title}}"
    media_folder: /assets/policies
    public_folder: /assets/policies
    fields:
      - { name: title, label: Title, widget: string, hint: "The link text shown in the website footer." }
      - name: file
        label: Document (PDF)
        widget: file
        hint: "Upload a new PDF or pick an existing one."
      - { name: order, label: Position, widget: number, value_type: int, required: false, hint: "Lower numbers appear first in the footer." }

  - name: gallery
    label: Gallery
    files:
      - name: gallery
        label: Gallery Images
        file: data/gallery.json
        fields:
          - name: gallery
            label: Gallery Images
            label_singular: Gallery Image
            widget: list
            summary: "{{fields.title}}"
            fields:
              - { name: src, label: Image, widget: image }
              - { name: alt, label: Alt Text, widget: string, hint: "Short description for screen readers." }
              - { name: title, label: Caption, widget: string }

  - name: testimonials
    label: Testimonials
    label_singular: Testimonial
    folder: data/testimonials
    extension: json
    format: json
    create: true
    identifier_field: from
    summary: "{{from}} — {{date}}"
    sortable_fields: [date, from]
    fields:
      - { name: statement, label: Statement, widget: text, hint: "The quote, in the person's own words. Don't add quotation marks." }
      - { name: from, label: From, widget: string, hint: "Who said it, e.g. Parent of a Year 4 pupil." }
      - { name: enabled, label: Show on website, widget: boolean, default: true }
      - { name: date, label: Date, widget: datetime, format: "YYYY-MM-DD", date_format: "DD/MM/YYYY", time_format: false, picker_utc: true }
